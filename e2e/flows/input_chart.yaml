appId: ${APP_ID}
---
# Birth data input and chart generation flow
# Tests: Form input, validation, chart computation, result display

- launchApp

# Navigate to input screen
- tapOn:
    id: "get-started-button"
- assertVisible:
    text: "Enter Birth Data"

# Ensure Birth Data tab is selected
- tapOn:
    id: "tab-birth-data"

# Test 1: Verify form fields are visible
- assertVisible:
    text: "Birth Date"
- assertVisible:
    text: "Birth Time"
- assertVisible:
    text: "Birth Location"
- assertVisible:
    text: "Time Zone"

# Test 2: Input valid birth data (MM/DD/YYYY format)
- tapOn:
    id: "field-date-input"
- inputText: "10/03/1992"

# Input birth time (HH:MM AM/PM format)
- tapOn:
    id: "field-time-input"
- inputText: "12:03 AM"

# Input location
- tapOn:
    id: "field-location-input"
- inputText: "Attleboro, MA"

# Test 3: Verify compute button is enabled
- assertVisible:
    id: "button-compute-chart"

# Submit form
- tapOn:
    id: "button-compute-chart"

# Test 4: Verify form submission completed successfully
# (End of basic input flow test)
