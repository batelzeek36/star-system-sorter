appId: ${APP_ID}
---
# Complete user journey: onboarding → input → result → why screen
# Tests the full flow from app launch to viewing classification results

- launchApp

# Step 1: Onboarding Screen
- assertVisible:
    text: "Star System Sorter"
- assertVisible:
    text: "Begin Sorting"

# Complete onboarding
- tapOn:
    id: "get-started-button"
- assertVisible:
    text: "Enter Birth Data"

# Step 2: Input Screen - Fill in birth data (known test case)
# Using test data: 1992-10-03 00:03 in Attleboro, MA
- tapOn:
    id: "tab-birth-data"

# Input birth date (MM/DD/YYYY format)
- tapOn:
    id: "field-date-input"
- inputText: "10/03/1992"

# Input birth time (HH:MM AM/PM format)
- tapOn:
    id: "field-time-input"
- inputText: "12:03 AM"

# Input location
- tapOn:
    id: "field-location-input"
- inputText: "Attleboro, MA"

# Compute chart
- tapOn:
    id: "button-compute-chart"

# Wait for processing and navigation to result screen (API call may take time)
- extendedWaitUntil:
    visible:
      id: "result-screen"
    timeout: 30000

# Step 3: Result Screen - Verify result elements
- assertVisible:
    text: "Your Primary Star System"
- assertVisible:
    id: "primary-system-name"
- assertVisible:
    id: "disclaimer-text"

# Navigate to Why screen
- tapOn:
    id: "view-why-button"

# Step 4: Why Screen - Verify explanation content
- assertVisible:
    id: "why-screen-app-bar"
- assertVisible:
    text: "Your Human Design attributes contributed to these star systems"

# Verify at least one system card is shown
- assertVisible:
    text: "%"

# Go back to result screen
- tapOn:
    id: "why-screen-app-bar-back"
- assertVisible:
    id: "result-screen"
